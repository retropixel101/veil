<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veil</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0d0d;
    color: #f1f1f1;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* ==============================
   PAGE
============================== */

#veil {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #0d0d0d;
}

/* ==============================
   PROXY FRAME
============================== */

#frame-container {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    background: #ffffff;

    opacity: 0;

    transition:
        opacity .25s ease;
}

#frame-container.loaded {
    opacity: 1;
}

#embed-frame {
    width: 100%;
    height: 100%;

    display: block;

    border: 0;

    background: #fff;
}

/* ==============================
   STATUS SCREEN
============================== */

#status {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0d0d0d;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

#status.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* ==============================
   STATUS BOX
============================== */

.status-box {
    width: min(390px, calc(100% - 32px));

    padding: 28px;

    background: #151515;

    border: 1px solid #292929;

    border-radius: 14px;

    text-align: center;
}

/* ==============================
   VEIL ICON
============================== */

.veil-icon {
    width: 48px;
    height: 48px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #1c1c1c;

    border: 1px solid #303030;

    border-radius: 12px;
}

.veil-icon svg {
    width: 27px;
    height: 27px;
}

/* ==============================
   LOADING
============================== */

.spinner {
    width: 24px;
    height: 24px;

    margin: 0 auto 17px;

    border: 2px solid #292929;
    border-top-color: #d8d8d8;

    border-radius: 50%;

    animation:
        veil-spin .8s linear infinite;
}

@keyframes veil-spin {
    to {
        transform: rotate(360deg);
    }
}

#status-title {
    font-size: 16px;
    font-weight: 600;

    line-height: 1.4;
}

#status-message {
    margin-top: 7px;

    color: #858585;

    font-size: 12px;
    line-height: 1.5;

    word-break: break-word;
}

/* ==============================
   BUTTONS
============================== */

.veil-button {
    display: none;

    margin-top: 18px;

    height: 35px;

    padding: 0 15px;

    background: #1d1d1d;

    color: #e7e7e7;

    border: 1px solid #303030;

    border-radius: 8px;

    cursor: pointer;

    font-size: 12px;

    transition:
        background .15s ease,
        border-color .15s ease;
}

.veil-button:hover {
    background: #252525;
    border-color: #414141;
}

/* ==============================
   ERROR
============================== */

#error {
    display: none;
    width: 100%;
    text-align: center;
}

#error.visible {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#error-title {
    color: #e5e5e5;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
}

#error-message {
    margin-top: 8px;
    color: #858585;
    font-size: 12px;
    line-height: 1.5;
}

#error .veil-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin: 18px auto 0;

    height: 35px;
    padding: 0 15px;
}

#error-details {
    display: none;
    width: 100%;

    margin-top: 14px;
    padding: 10px;

    max-height: 110px;
    overflow: auto;

    text-align: left;

    background: #0f0f0f;
    border: 1px solid #282828;
    border-radius: 7px;

    color: #777;
    font-family: monospace;
    font-size: 10px;

    word-break: break-word;
}

/* ==============================
   MOBILE
============================== */

@media (max-width: 500px) {

    .status-box {
        padding: 24px 20px;
    }

}
</style>
</head>

<body>

<div id="veil">

    <!-- Proxied page -->
    <div id="frame-container"></div>

    <!-- Loading / error UI -->
    <div id="status">

        <div class="status-box">

            <div class="veil-icon">
                <svg
                    viewBox="0 0 100 100"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M50 12L82 27V48C82 70 68 86 50 92C32 86 18 70 18 48V27L50 12Z"
                        stroke="#eeeeee"
                        stroke-width="7"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>

            <!-- Loading -->
            <div id="loading">

                <div class="spinner"></div>

                <div id="status-title">
                    Connecting
                </div>

                <div id="status-message">
                    Starting Veil...
                </div>

                <button
                    id="continue-button"
                    class="veil-button"
                >
                    Continue
                </button>

            </div>

            <!-- Error -->
            <div id="error">

                <div id="error-title">
                    Unable to Load
                </div>

                <div id="error-message">
                    Veil could not load this page.
                </div>

                <button
                    id="retry-button"
                    class="veil-button"
                    style="display:inline-flex"
                >
                    Retry
                </button>

                <div id="error-details"></div>

            </div>

        </div>

    </div>

</div>

<script type="module">

/* =========================================================
   VEIL EMBED
========================================================= */

"use strict";


/* =========================================================
   PATHS
========================================================= */

const ROOT =
    new URL(".", window.location.href);

const PATH = ROOT.pathname;


/*
    Local Veil assets.

    These match the current repository structure:

        sj/
        ep/
        bm/
*/

const SCRAMJET_ALL =
    new URL("sj/scramjet.all.js", ROOT).href;

const SCRAMJET_SYNC =
    new URL("sj/scramjet.sync.js", ROOT).href;

const SCRAMJET_WASM =
    new URL("sj/scramjet.wasm.wasm", ROOT).href;

const BAREMUX =
    new URL("bm/index.mjs", ROOT).href;

const BAREWORKER =
    new URL("bm/worker.js", ROOT).href;

const EPOXY =
    new URL("ep/index.mjs", ROOT).href;


/* =========================================================
   WISP
========================================================= */

const WISP_URL =
    "wss://wisp-backend-weyl.onrender.com/";


/* =========================================================
   ELEMENTS
========================================================= */

const status =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const error =
    document.getElementById("error");

const statusTitle =
    document.getElementById("status-title");

const statusMessage =
    document.getElementById("status-message");

const continueButton =
    document.getElementById("continue-button");

const retryButton =
    document.getElementById("retry-button");

const errorTitle =
    document.getElementById("error-title");

const errorMessage =
    document.getElementById("error-message");

const errorDetails =
    document.getElementById("error-details");

const frameContainer =
    document.getElementById("frame-container");


/* =========================================================
   TARGET URL
========================================================= */

function getTargetURL() {

    const raw =
        window.location.hash.substring(1);

    if (!raw) {
        return null;
    }

    try {

        return decodeURIComponent(raw);

    } catch {

        return raw;

    }
}


/* =========================================================
   URL VALIDATION
========================================================= */

function isValidURL(value) {

    try {

        const url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    } catch {

        return false;

    }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(title, message) {

    statusTitle.textContent =
        title;

    statusMessage.textContent =
        message;

}


/* =========================================================
   SHOW PAGE
========================================================= */

function showPage() {

    frameContainer.classList.add(
        "loaded"
    );

    status.classList.add(
        "hidden"
    );

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    title,
    message,
    details = ""
) {

    loading.style.display =
        "none";

    error.classList.add(
        "visible"
    );

    errorTitle.textContent =
        title;

    errorMessage.textContent =
        message;

    if (details) {

        errorDetails.style.display =
            "block";

        errorDetails.textContent =
            details;

    }

}


/* =========================================================
   LOAD SCRIPT
========================================================= */

function loadScript(src) {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                src;

            script.onload =
                () => resolve();

            script.onerror =
                () => reject(
                    new Error(
                        "Failed to load: " +
                        src
                    )
                );

            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   SCRAMJET CONFIG
========================================================= */

function configureScramjet() {

    /*
        The proxy namespace is kept
        underneath the embed page.

        This prevents the proxied pages
        from taking over the rest of Veil.
    */

    const prefix =
        PATH.replace(
            /[^/]*$/,
            ""
        ) + "service/";

    window.__scramjet$config = {

        prefix,

        files: {

            wasm:
                SCRAMJET_WASM,

            all:
                SCRAMJET_ALL,

            sync:
                SCRAMJET_SYNC

        }

    };

    return prefix;

}


/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerServiceWorker(
    prefix
) {

    if (
        !("serviceWorker" in navigator)
    ) {

        throw new Error(
            "Service workers are not supported."
        );

    }

    setStatus(
        "Starting Veil",
        "Registering the proxy..."
    );

    const registration =
        await navigator.serviceWorker.register(
            new URL(
                "SW.js",
                ROOT
            ).href,
            {
                scope:
                    new URL(
                        prefix,
                        window.location.href
                    ).href
            }
        );

    await navigator.serviceWorker.ready;

    return registration;

}


/* =========================================================
   BAREMUX
========================================================= */

async function initializeBareMux() {

    setStatus(
        "Connecting",
        "Initializing the network..."
    );

    const BareMux =
        await import(
            BAREMUX
        );

    if (
        !BareMux.BareMuxConnection
    ) {

        throw new Error(
            "BareMuxConnection was not found."
        );

    }

    const connection =
        new BareMux.BareMuxConnection(
            BAREWORKER
        );

    /*
        Epoxy transport.
    */

    const Epoxy =
        await import(
            EPOXY
        );

    /*
        Support the different export
        styles used by Epoxy versions.
    */

    let transport =
        Epoxy.default ||
        Epoxy.EpoxyTransport ||
        Epoxy;

    if (
        typeof transport === "object" &&
        transport.default
    ) {

        transport =
            transport.default;

    }

    await connection.setTransport(
        transport,
        [
            {
                wisp:
                    WISP_URL
            }
        ]
    );

    return connection;

}


/* =========================================================
   SCRAMJET
========================================================= */

async function initializeScramjet() {

    setStatus(
        "Starting Veil",
        "Loading the browser engine..."
    );

    /*
        scramjet.all.js is loaded locally.
    */

    await loadScript(
        SCRAMJET_ALL
    );

    /*
        The bundled file normally exposes
        the Scramjet loader globally.
    */

    if (
        typeof window.$scramjetLoadController !==
        "function"
    ) {

        throw new Error(
            "$scramjetLoadController was not found."
        );

    }

    const loaded =
        window.$scramjetLoadController();

    const ScramjetController =
        loaded.ScramjetController ||
        window.ScramjetController;

    if (!ScramjetController) {

        throw new Error(
            "ScramjetController was not found."
        );

    }

    const prefix =
        configureScramjet();

    const scramjet =
        new ScramjetController({

            prefix,

            files: {

                wasm:
                    SCRAMJET_WASM,

                all:
                    SCRAMJET_ALL,

                sync:
                    SCRAMJET_SYNC

            }

        });

    await scramjet.init();

    return scramjet;

}


/* =========================================================
   CREATE FRAME
========================================================= */

async function createFrame(
    scramjet,
    targetURL
) {

    setStatus(
        "Loading",
        targetURL
    );

    const activeFrame =
        scramjet.createFrame();

    if (
        !activeFrame ||
        !activeFrame.frame
    ) {

        throw new Error(
            "Scramjet failed to create the frame."
        );

    }

    const iframe =
        activeFrame.frame;

    iframe.id =
        "embed-frame";

    iframe.setAttribute(
        "allow",
        "fullscreen; autoplay; clipboard-read; clipboard-write"
    );

    iframe.setAttribute(
        "referrerpolicy",
        "no-referrer"
    );

    iframe.addEventListener(
        "load",
        () => {

            showPage();

        },
        {
            once: true
        }
    );

    frameContainer.appendChild(
        iframe
    );

    /*
        Don't leave the user stuck forever
        if a page takes a long time.
    */

    const timeout =
        setTimeout(
            () => {

                continueButton.style.display =
                    "inline-flex";

                continueButton.onclick =
                    showPage;

                setStatus(
                    "Taking a while",
                    "The website is still loading."
                );

            },
            8000
        );

    iframe.addEventListener(
        "load",
        () => clearTimeout(timeout),
        {
            once: true
        }
    );

    activeFrame.go(
        targetURL
    );

}


/* =========================================================
   START VEIL
========================================================= */

async function start() {

    const targetURL =
        getTargetURL();

    /*
        No URL.
    */

    if (!targetURL) {

        showError(
            "No URL Provided",
            "Veil failed to load the URL.",
            "Example: embed.html#https://example.com"
        );

        return;

    }

    /*
        Invalid URL.
    */

    if (!isValidURL(targetURL)) {

        showError(
            "Invalid URL",
            "Only HTTP and HTTPS addresses are supported.",
            targetURL
        );

        return;

    }

    try {

        /*
            Configure Scramjet before
            starting the service worker.
        */

        const prefix =
            configureScramjet();

        /*
            Start service worker.
        */

        await registerServiceWorker(
            prefix
        );

        /*
            Start BareMux.
        */

        await initializeBareMux();

        /*
            Start Scramjet.
        */

        const scramjet =
            await initializeScramjet();

        /*
            Create the proxied page.
        */

        await createFrame(
            scramjet,
            targetURL
        );

    } catch (err) {

        console.error(
            "[VEIL EMBED]",
            err
        );

        showError(
            "Veil Error",
            "The browser engine could not be initialized.",
            err?.stack ||
            err?.message ||
            String(err)
        );

    }

}


/* =========================================================
   RETRY
========================================================= */

retryButton.onclick =
    () => {

        window.location.reload();

    };


/* =========================================================
   HASH NAVIGATION
========================================================= */

window.addEventListener(
    "hashchange",
    () => {

        window.location.reload();

    }
);


/* =========================================================
   BOOT
========================================================= */

start();

</script>

</body>
</html>
