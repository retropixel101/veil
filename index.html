<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veil</title>

    <!-- Local Veil assets -->
    <script src="./sj/scramjet.all.js" defer></script>

    <script type="module">
        import * as BareMux from "./bm/index.mjs";
        window.BareMux = BareMux;
    </script>

    <script src="./sc.js" defer></script>

    <style>
        :root {
            --bg: #0b0c0f;
            --surface: #111318;
            --surface-2: #17191f;
            --surface-3: #1d2027;

            --border: #292d35;
            --border-light: #343943;

            --text: #f2f3f5;
            --text-secondary: #a5a9b2;
            --text-muted: #707580;

            --accent: #e6e8ec;
            --danger: #ef4444;

            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            outline: none;
        }

        /* --------------------------------
           APP
        -------------------------------- */

        #app {
            width: 100%;
            height: 100%;
            min-height: 0;
            background: var(--bg);
        }

        /* --------------------------------
           WISP SETTINGS
        -------------------------------- */

        .wisp-settings-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(5, 6, 8, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            opacity: 1;
            visibility: visible;
            transition:
                opacity 0.18s ease,
                visibility 0.18s ease;
        }

        .wisp-settings-modal.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .settings-card {
            width: min(500px, 100%);
            max-height: min(700px, calc(100vh - 40px));

            display: flex;
            flex-direction: column;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        /* --------------------------------
           HEADER
        -------------------------------- */

        .settings-header {
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .settings-header h2 {
            margin: 0;

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .settings-header h2 i {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .close-btn {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            color: var(--text-secondary);
            background: transparent;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .close-btn:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        /* --------------------------------
           CONTENT
        -------------------------------- */

        .settings-content {
            padding: 20px;
            overflow-y: auto;
        }

        .section-title {
            margin: 0 0 10px;

            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--text-secondary);

            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .section-title:not(:first-child) {
            margin-top: 24px;
        }

        .section-title i {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* --------------------------------
           SERVER LIST
        -------------------------------- */

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .server-item {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 52px;
            padding: 10px 13px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--surface-2);
            color: var(--text);

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .server-item:hover {
            background: var(--surface-3);
            border-color: var(--border-light);
        }

        .server-item.active {
            background: #1a1d23;
            border-color: #555b66;
        }

        .server-info {
            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
        }

        .server-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .server-url {
            max-width: 330px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: var(--text-muted);
            font-size: 11px;
        }

        .server-status {
            flex-shrink: 0;

            display: flex;
            align-items: center;
            gap: 6px;

            margin-left: 12px;

            color: var(--text-muted);
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: #555b65;
        }

        .status-dot.online {
            background: #8b929d;
        }

        .status-dot.error {
            background: var(--danger);
        }

        /* --------------------------------
           CUSTOM SERVER
        -------------------------------- */

        .custom-input-group {
            display: flex;
            gap: 8px;
        }

        #custom-wisp-input {
            min-width: 0;
            flex: 1;

            height: 42px;

            padding: 0 12px;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;

            background: var(--surface-2);
            color: var(--text);

            font-size: 12px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        #custom-wisp-input::placeholder {
            color: var(--text-muted);
        }

        #custom-wisp-input:focus {
            background: var(--surface-3);
            border-color: var(--border-light);
        }

        #save-custom-wisp {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: var(--surface-3);
            color: var(--text);

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        #save-custom-wisp:hover {
            background: #242830;
            border-color: var(--border-light);
        }

        /* --------------------------------
           FOOTER
        -------------------------------- */

        .settings-footer {
            padding: 13px 20px;

            border-top: 1px solid var(--border);

            color: var(--text-muted);

            background: #0f1014;

            font-size: 11px;
            text-align: center;
        }

        /* --------------------------------
           SCROLLBAR
        -------------------------------- */

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #292d35;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #383d47;
        }

        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 600px) {
            .settings-card {
                max-height: calc(100vh - 24px);
                border-radius: 13px;
            }

            .settings-header {
                height: 58px;
                padding: 0 16px;
            }

            .settings-content {
                padding: 16px;
            }

            .settings-footer {
                padding: 12px 16px;
            }

            .server-url {
                max-width: 210px;
            }
        }
    </style>
</head>

<body>

    <div id="app"></div>

    <!-- Veil Wisp Server Settings -->
    <div
        class="wisp-settings-modal hidden"
        id="wisp-settings-modal"
    >
        <div class="settings-card">

            <div class="settings-header">
                <h2>
                    <i class="fa-solid fa-server"></i>
                    Proxy Server
                </h2>

                <button
                    class="close-btn"
                    id="close-wisp-modal"
                    aria-label="Close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="settings-content">

                <div class="section-title">
                    <i class="fa-solid fa-network-wired"></i>
                    Servers
                </div>

                <div
                    class="server-list"
                    id="server-list"
                ></div>

                <div class="section-title">
                    <i class="fa-solid fa-plus"></i>
                    Custom Server
                </div>

                <div class="custom-input-group">
                    <input
                        type="text"
                        id="custom-wisp-input"
                        placeholder="wss://your-server.com/wisp/"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <button
                        id="save-custom-wisp"
                        aria-label="Add custom server"
                    >
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

            </div>

            <div class="settings-footer">
                Choose the server with the best connection for you.
            </div>

        </div>
    </div>

</body>
</html>
