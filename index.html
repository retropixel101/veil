<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Veil</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101010'/%3E%3Cpath d='M50 15L80 28V48C80 69 67 84 50 90C33 84 20 69 20 48V28L50 15Z' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E">
<style>
:root{
 --bg:#101010;--bg2:#151515;--bg3:#1b1b1b;--panel:#181818;--panel2:#202020;
 --border:#2b2b2b;--text:#f2f2f2;--muted:#888;--accent:#fff;--accentText:#111;--newtab:#101010;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#browser{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
html,body,#browser,.chrome,.tabs-row,.toolbar,.viewport,.page{background-image:none!important;filter:none!important}
html,body,#browser,.chrome,.tabs-row,.toolbar,.viewport,.page{box-shadow:none!important}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:0;outline:0}button:focus,input:focus{outline:0}

#browser{display:flex;flex-direction:column}
.chrome{flex:0 0 auto;background:var(--bg2);border-bottom:1px solid var(--border);position:relative;z-index:100}
.tabs-row{height:42px;display:flex;align-items:flex-end;padding:0 7px;gap:4px;overflow:hidden}
.tabs{height:100%;display:flex;align-items:flex-end;gap:4px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:36px;min-width:145px;max-width:235px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 7px 0 10px;border-radius:9px 9px 0 0;background:transparent;color:var(--muted);cursor:pointer;user-select:none;position:relative;transform-origin:left center;transition:background .14s ease,color .14s ease}
.tab:hover{background:var(--bg3);color:var(--text)}
.tab.active{background:var(--panel);color:var(--text)}
.tab.opening{animation:tabOpen .18s cubic-bezier(.2,.8,.2,1)}
.tab.closing{animation:tabClose .16s cubic-bezier(.4,0,1,1) forwards}
@keyframes tabOpen{from{opacity:0;transform:scaleX(.72) translateY(4px)}to{opacity:1;transform:scaleX(1) translateY(0)}}
@keyframes tabClose{from{opacity:1;transform:scaleX(1)}to{opacity:0;transform:scaleX(.72)}}
.tab-icon{width:16px;height:16px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:0}
.tab-icon svg{width:14px;height:14px;display:block}
.tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:1}
.tab-close{width:21px;height:21px;flex:0 0 21px;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.tab-close:hover{background:var(--panel2);color:var(--text)}
.new-tab{width:32px;height:32px;flex:0 0 32px;margin-bottom:2px;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;transition:background .14s,color .14s}
.new-tab:hover{background:var(--panel2);color:var(--text)}

.toolbar{height:52px;display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--panel);overflow:hidden}
.nav-buttons{display:flex;gap:2px;flex:0 0 auto}
.tool-btn,.menu-btn{background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tool-btn{width:35px;height:35px;border-radius:8px;font-size:18px;transition:background .14s,color .14s}
.tool-btn:hover,.menu-btn:hover{background:var(--panel2);color:var(--text)}
.tool-btn:disabled{opacity:.28;cursor:default}
.address-wrap{flex:1;min-width:0;height:35px;display:flex;align-items:center;border-radius:18px;background:var(--bg2);border:1px solid var(--border);padding:0 7px 0 13px}
.address-wrap:focus-within{border-color:#444;background:var(--bg3)}
.address-icon{color:var(--muted);margin-right:8px;font-size:14px;flex:0 0 auto}
#address{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:13px}
#address::placeholder{color:#666}
.address-bookmark{width:29px;height:29px;flex:0 0 29px;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
.address-bookmark:hover{background:var(--panel2);color:var(--text)}
.address-bookmark.saved{color:var(--accent)}
.menu-btn{width:36px;height:36px;flex:0 0 36px;border-radius:9px;font-size:20px;letter-spacing:1px}

.viewport{position:relative;flex:1;min-height:0;width:100%;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;display:none;background:var(--bg)}
.page.active{display:block}
.engine-frame{width:100%;height:100%;display:block;border:0;background:#fff}

.newtab-page{width:100%;height:100%;overflow:auto;background-color:var(--newtab);background-size:cover;background-position:center;background-repeat:no-repeat;position:relative}
.newtab-overlay{width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:transparent}
.newtab-center{width:min(700px,100%);text-align:center}
.veil-mark{width:74px;height:74px;margin:0 auto 22px;border-radius:22px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.veil-mark svg{width:42px;height:42px}
.newtab-title{font-size:clamp(42px,7vw,70px);font-weight:700;letter-spacing:-3px;line-height:1}
.newtab-subtitle{color:var(--muted);margin-top:12px;font-size:14px}
.search-box{width:min(620px,100%);height:54px;margin:30px auto 0;border-radius:17px;background:rgba(20,20,20,.9);border:1px solid var(--border);display:flex;align-items:center;padding:0 18px}
.search-box span{color:var(--muted);margin-right:11px}.search-box input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:14px}
.quick-links{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:22px}
.quick-link{border:1px solid var(--border);background:rgba(20,20,20,.72);color:var(--muted);padding:9px 13px;border-radius:11px;cursor:pointer;font-size:12px}
.quick-link:hover{color:var(--text);background:var(--panel2)}

.menu{position:fixed;top:94px;right:10px;width:245px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:7px;z-index:1000;display:none}
.menu.open{display:block}
.menu-item{width:100%;height:38px;padding:0 11px;border-radius:8px;background:transparent;color:var(--text);display:flex;align-items:center;gap:11px;cursor:pointer;text-align:left;font-size:13px}
.menu-item:hover{background:var(--panel2)}.menu-icon{width:20px;text-align:center;color:var(--muted)}
.menu-separator{height:1px;background:var(--border);margin:6px 4px}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:none}.backdrop.open{display:block}
.panel{position:fixed;right:0;top:0;height:100%;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--border);z-index:1200;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-header{height:65px;padding:0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-size:17px}.close-panel{width:32px;height:32px;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.close-panel:hover{background:var(--panel2);color:var(--text)}
.panel-body{padding:20px;overflow-y:auto}
.setting-section{margin-bottom:28px}.setting-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:11px}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.preset{min-height:67px;border:1px solid var(--border);background:var(--bg2);border-radius:11px;cursor:pointer;text-align:left;padding:10px;transition:border-color .14s,transform .14s}
.preset:hover{border-color:#555;transform:translateY(-1px)}
.preset-name{font-size:12px;margin-bottom:9px}.preset-preview{display:flex;gap:5px}.preset-dot{width:14px;height:14px;border-radius:50%}
.input-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}.input-label{width:90px;flex:0 0 90px;font-size:12px;color:var(--muted)}
.text-input{flex:1;min-width:0;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);padding:0 10px;font-size:12px}
.color-input{width:45px;height:36px;padding:3px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);cursor:pointer}
.primary-btn{width:100%;height:38px;border-radius:9px;background:var(--accent);color:var(--accentText);cursor:pointer;font-size:12px;font-weight:600}.primary-btn:hover{opacity:.9}
.secondary-btn{width:100%;height:38px;border-radius:9px;background:var(--bg2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px}
.bookmark-row{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--border);background:var(--bg2);border-radius:9px;margin-bottom:8px}
.bookmark-main{min-width:0;flex:1;cursor:pointer}.bookmark-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bookmark-url{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.bookmark-delete{width:28px;height:28px;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}.bookmark-delete:hover{background:var(--panel2);color:var(--danger)}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:12px}
.status{padding:10px 12px;border:1px solid var(--border);background:var(--bg2);border-radius:9px;color:var(--muted);font-size:11px;line-height:1.5}

.cookie-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
.cookie-box{width:min(430px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px}
.cookie-logo{width:48px;height:48px;margin-bottom:17px;color:var(--accent)}.cookie-logo svg{width:100%;height:100%}
.cookie-box h2{font-size:20px}.cookie-box p{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6}
.cookie-buttons{display:flex;gap:9px;margin-top:22px}.cookie-no,.cookie-yes{flex:1;height:40px;border-radius:9px;cursor:pointer;font-size:12px}
.cookie-no{background:var(--bg2);border:1px solid var(--border);color:var(--text)}.cookie-yes{background:var(--accent);color:var(--accentText)}

.engine-error{height:100%;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--bg)}
.engine-error-box{width:min(560px,100%);border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:24px}
.engine-error-box h2{font-size:18px}.engine-error-box p{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.6}
.engine-error-box button{margin-top:16px;height:36px;padding:0 14px;border-radius:8px;background:var(--accent);color:var(--accentText);cursor:pointer;font-size:12px}

@media(max-width:650px){
 .tab{min-width:125px}.toolbar{gap:3px;padding:6px}.tool-btn{width:32px}.address-wrap{padding-left:10px}.menu-btn{width:32px}
}
</style>
</head>
<body>
<div id="browser">
  <header class="chrome">
    <div class="tabs-row">
      <div class="tabs" id="tabs"></div>

    </div>
    <div class="toolbar">
      <div class="nav-buttons">
        <button class="tool-btn" id="backBtn" title="Back">‹</button>
        <button class="tool-btn" id="forwardBtn" title="Forward">›</button>
        <button class="tool-btn" id="refreshBtn" title="Refresh">↻</button>
      </div>
      <div class="address-wrap">
        <span class="address-icon">⌕</span>
        <input id="address" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter address">

</div>

<div class="menu" id="mainMenu">
  <button class="menu-item" id="menuNewTab"><span class="menu-icon">＋</span>New tab</button>
  <button class="menu-item" id="menuBookmark"><span class="menu-icon">☆</span>Bookmark this page</button>

  <button class="menu-item" id="menuRename"><span class="menu-icon">✎</span>Rename current tab</button>

    <section class="setting-section">
      <div class="setting-title">Themes</div>

        <button class="preset" data-theme="matte"><div class="preset-name">Matte Black</div><div class="preset-preview"><i class="preset-dot" style="background:#101010"></i><i class="preset-dot" style="background:#1b1b1b"></i><i class="preset-dot" style="background:#fff"></i></div></button>
        <button class="preset" data-theme="sakura"><div class="preset-name">Sakura</div><div class="preset-preview"><i class="preset-dot" style="background:#190e14"></i><i class="preset-dot" style="background:#321725"></i><i class="preset-dot" style="background:#ff8fba"></i></div></button>
        <button class="preset" data-theme="forest"><div class="preset-name">Forest</div><div class="preset-preview"><i class="preset-dot" style="background:#0b140e"></i><i class="preset-dot" style="background:#17291b"></i><i class="preset-dot" style="background:#73c982"></i></div></button>
        <button class="preset" data-theme="twilight"><div class="preset-name">Twilight</div><div class="preset-preview"><i class="preset-dot" style="background:#110d1a"></i><i class="preset-dot" style="background:#241936"></i><i class="preset-dot" style="background:#b88cff"></i></div></button>
        <button class="preset" data-theme="sunlight"><div class="preset-name">Sunlight</div><div class="preset-preview"><i class="preset-dot" style="background:#191108"></i><i class="preset-dot" style="background:#32200c"></i><i class="preset-dot" style="background:#ffb84d"></i></div></button>
        <button class="preset" data-theme="midnight"><div class="preset-name">Midnight</div><div class="preset-preview"><i class="preset-dot" style="background:#080b12"></i><i class="preset-dot" style="background:#121827"></i><i class="preset-dot" style="background:#7aa2ff"></i></div></button>
      </div>

    <section class="setting-section">
      <div class="setting-title">Custom colors</div>
      <div class="input-row"><label class="input-label">Background</label><input class="color-input" id="colorBg" type="color"></div>
      <div class="input-row"><label class="input-label">Panel</label><input class="color-input" id="colorPanel" type="color"></div>
      <div class="input-row"><label class="input-label">Accent</label><input class="color-input" id="colorAccent" type="color"></div>
      <div class="input-row"><label class="input-label">Text</label><input class="color-input" id="colorText" type="color"></div>
      <button class="primary-btn" id="applyColors">Apply colors</button>
    </section>

    <section class="setting-section">
      <div class="setting-title">New-tab background</div>

      <button class="primary-btn" id="applyBackground">Apply background</button>

    <section class="setting-section">
      <div class="setting-title">Tab cloak</div>

    <section class="setting-section">

<aside class="panel" id="bookmarksPanel">
  <div class="panel-header"><h2>Bookmarks</h2><button class="close-panel" data-close-panel>×</button></div>
  <div class="panel-body" id="bookmarkList"></div>

<script>
"use strict";

/* Veil engine configuration */
const REPO_PATH = (() => {
  const p = location.pathname;
  if (p.endsWith("/")) return p;
  const last = p.lastIndexOf("/");
  return p.slice(0,last + 1);
})();
const SCRAMJET_PREFIX = REPO_PATH + "service/";
const SCRAMJET_FILES = {
  all: REPO_PATH + "scram/scramjet.all.js",
  sync: REPO_PATH + "scram/scramjet.sync.js",
  wasm: REPO_PATH + "scram/scramjet.wasm.wasm",
  config: REPO_PATH + "scram/scramjet.config.js"
};
const BAREMUX_SCRIPT = REPO_PATH + "baremux/index.js";
const BAREMUX_WORKER = REPO_PATH + "baremux/worker.js";
const WISP_URL = "wss://wisp-backend-weyl.onrender.com";

let engineReady = false;
let engineController = null;
let engineInitPromise = null;

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=resolve;
    s.onerror=()=>reject(new Error("Could not load "+src));
    document.head.appendChild(s);
  });
}

async function initEngine(){
  if(engineInitPromise) return engineInitPromise;
  engineInitPromise=(async()=>{
    const status=document.getElementById("engineStatus");
    try{
      if(!window.BareMux) await loadScript(BAREMUX_SCRIPT);
      if(!window.$scramjetLoadController && !window.ScramjetController){
        await loadScript(SCRAMJET_FILES.all);
      }

      if(!("serviceWorker" in navigator)) throw new Error("Service workers are unavailable.");
      await navigator.serviceWorker.register(REPO_PATH+"SW.js",{scope:SCRAMJET_PREFIX});

      if(!window.BareMux) throw new Error("BareMux did not load.");
      const mux = new BareMux.BareMuxConnection(BAREMUX_WORKER);
      await mux.setTransport(BAREMUX_WORKER,[{wisp:WISP_URL}]);

      if(typeof window.$scramjetLoadController==="function"){
        const loaded=window.$scramjetLoadController();
        const Controller=loaded && loaded.ScramjetController;
        if(!Controller) throw new Error("ScramjetController was not found.");
        engineController=new Controller({
          files:SCRAMJET_FILES,
          prefix:SCRAMJET_PREFIX
        });
        if(typeof engineController.init==="function") await engineController.init();
      }else if(typeof window.ScramjetController==="function"){
        engineController=new window.ScramjetController({
          files:SCRAMJET_FILES,
          prefix:SCRAMJET_PREFIX
        });
        if(typeof engineController.init==="function") await engineController.init();
      }else{
        throw new Error("Scramjet controller is unavailable.");
      }

      engineReady=true;
      status.textContent="Ready • Wisp connection configured";
      return true;
    }catch(error){
      console.error(error);
      status.textContent="Engine error • check the Scramjet/BareMux files";
      return false;
    }
  })();
  return engineInitPromise;
}

/* Themes */
const THEMES={
  matte:{bg:"#101010",bg2:"#151515",bg3:"#1b1b1b",panel:"#181818",panel2:"#202020",border:"#2b2b2b",text:"#f2f2f2",muted:"#888888",accent:"#ffffff",accentText:"#111111",newtab:"#101010"},
  sakura:{bg:"#190e14",bg2:"#21111a",bg3:"#321725",panel:"#28131e",panel2:"#3a1b29",border:"#512538",text:"#fff0f6",muted:"#b991a3",accent:"#ff8fba",accentText:"#250b16",newtab:"#190e14"},
  forest:{bg:"#0b140e",bg2:"#101b13",bg3:"#17291b",panel:"#132219",panel2:"#1b3020",border:"#29452f",text:"#effff1",muted:"#8da993",accent:"#73c982",accentText:"#071109",newtab:"#0b140e"},
  twilight:{bg:"#110d1a",bg2:"#171122",bg3:"#241936",panel:"#1c142b",panel2:"#2b1d40",border:"#412c5c",text:"#f7f0ff",muted:"#a89ab8",accent:"#b88cff",accentText:"#160c24",newtab:"#110d1a"},
  sunlight:{bg:"#191108",bg2:"#211609",bg3:"#32200c",panel:"#281a0a",panel2:"#3a250e",border:"#513716",text:"#fff8eb",muted:"#bca783",accent:"#ffb84d",accentText:"#241303",newtab:"#191108"},
  midnight:{bg:"#080b12",bg2:"#0d111b",bg3:"#121827",panel:"#101521",panel2:"#171e2d",border:"#263047",text:"#eef3ff",muted:"#8490a7",accent:"#7aa2ff",accentText:"#08101f",newtab:"#080b12"}
};
const DEFAULT_SETTINGS={theme:"matte",...THEMES.matte,backgroundUrl:""};
let settings={...DEFAULT_SETTINGS};
let bookmarks=[];
let cloak={title:"Veil",icon:""};
let tabs=[];
let activeTabId=null;
let tabCounter=0;

const COOKIE={
 consent:false,
 set(name,value,days=365){
  if(!this.consent)return;
  const expires=new Date(Date.now()+days*86400000).toUTCString();
  document.cookie=encodeURIComponent(name)+"="+encodeURIComponent(value)+"; expires="+expires+"; path=/; SameSite=Lax";
 },
 get(name){
  const target=encodeURIComponent(name)+"=";
  for(const part of document.cookie.split(";")){
   const p=part.trim();
   if(p.startsWith(target))return decodeURIComponent(p.slice(target.length));
  }
  return null;
 }
};
const STORAGE={bookmarks:"veil_bookmarks",settings:"veil_settings",cloak:"veil_cloak"};

function uid(){return "tab_"+Date.now().toString(36)+"_"+(++tabCounter).toString(36)}
function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function getTab(id=activeTabId){return tabs.find(t=>t.id===id)||null}
function getActiveTab(){return getTab()}
function isBookmarked(url){return bookmarks.some(b=>b.url===url)}

function save(){
 if(!COOKIE.consent)return;
 try{
  COOKIE.set(STORAGE.bookmarks,JSON.stringify(bookmarks));
  COOKIE.set(STORAGE.settings,JSON.stringify(settings));
  COOKIE.set(STORAGE.cloak,JSON.stringify(cloak));
 }catch(e){console.warn("Veil could not save settings:",e)}
}
function loadSavedData(){
 try{
  const b=COOKIE.get(STORAGE.bookmarks),s=COOKIE.get(STORAGE.settings),c=COOKIE.get(STORAGE.cloak);
  if(b)bookmarks=JSON.parse(b)||[];
  if(s)settings={...DEFAULT_SETTINGS,...JSON.parse(s)};
  if(c)cloak={...cloak,...JSON.parse(c)};
 }catch(e){console.warn("Veil saved data could not be loaded:",e)}
}

function applyCSSVariables(){
 const root=document.documentElement;
 ["bg","bg2","bg3","panel","panel2","border","text","muted","accent","accentText","newtab"].forEach(k=>root.style.setProperty("--"+k,settings[k]));
}
function applyNewTabBackground(){
 document.querySelectorAll(".newtab-page").forEach(el=>{
  el.style.backgroundImage=settings.backgroundUrl?`url("${settings.backgroundUrl.replace(/"/g,"%22")}")`:"none";
 });
}

function tabIcon(){
 return `<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M50 14L81 27V47C81 69 68 84 50 91C32 84 19 69 19 47V27L50 14Z" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/></svg>`;
}

function normalizeUrl(input){
 let value=String(input||"").trim();
 if(!value)return null;
 if(/^https?:\/\//i.test(value))return value;
 if(/^[a-z][a-z0-9+.-]*:/i.test(value))return value;
 if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(value))return "https://"+value;
 return "https://www.google.com/search?q="+encodeURIComponent(value);
}

async function createEngineFrame(page,wrapper){
 if(!engineReady){
  await initEngine();
 }
 if(!engineReady){
  wrapper.innerHTML=`<div class="engine-error"><div class="engine-error-box"><h2>Browser engine unavailable</h2><p>The Veil interface loaded, but the local Scramjet/BareMux files could not be initialized. Make sure the repository contains <b>scram/</b> and <b>baremux/</b>, and that <b>SW.js</b> is present at the repository root.</p><button data-retry-engine>Retry</button></div></div>`;
  wrapper.querySelector("[data-retry-engine]").onclick=()=>{engineInitPromise=null;renderViewport()};
  return;
 }
 try{
  let frameObj=null;
  if(engineController && typeof engineController.createFrame==="function"){
   frameObj=engineController.createFrame();
  }
  if(frameObj){
   const frame=frameObj.element||frameObj;
   frame.classList.add("engine-frame");
   frame.dataset.tabId=page.id;
   wrapper.appendChild(frame);
   page.engineFrame=frameObj;
   if(typeof frameObj.go==="function") frameObj.go(page.url);
   else if(typeof frameObj.navigate==="function") frameObj.navigate(page.url);
   else if(frame instanceof HTMLIFrameElement) frame.src=SCRAMJET_PREFIX+encodeURIComponent(page.url);
   return;
  }
  throw new Error("Scramjet frame API unavailable.");
 }catch(e){
  console.error(e);
  wrapper.innerHTML=`<div class="engine-error"><div class="engine-error-box"><h2>Could not open this page</h2><p>${escapeHTML(e.message)}</p><button data-retry-engine>Retry</button></div></div>`;
  const btn=wrapper.querySelector("[data-retry-engine]");
  if(btn)btn.onclick=()=>renderViewport();
 }
}

function renderTabs(){
 const c=document.getElementById("tabs");
 c.innerHTML=tabs.map(tab=>`
  <div class="tab ${tab.id===activeTabId?"active ":""}${tab.animOpen?"opening":""}" data-tab-id="${tab.id}">
   <div class="tab-icon">${tabIcon()}</div>
   <div class="tab-title">${escapeHTML(tab.title)}</div>
   <button class="tab-close" data-close="${tab.id}" aria-label="Close tab">×</button>
  </div>`).join("");
 tabs.forEach(t=>t.animOpen=false);
 c.querySelectorAll(".tab").forEach(el=>{
  el.addEventListener("click",e=>{
   if(e.target.closest(".tab-close"))return;
   activeTabId=el.dataset.tabId;
   render();
  });
  el.addEventListener("dblclick",e=>{if(!e.target.closest(".tab-close"))renameCurrentTab(el.dataset.tabId)});
 });
 c.querySelectorAll("[data-close]").forEach(btn=>btn.addEventListener("click",e=>{
  e.stopPropagation();closeTab(btn.dataset.close);
 }));
}

function renderViewport(){
 const viewport=document.getElementById("viewport");
 viewport.innerHTML="";
 tabs.forEach(page=>{
  const wrapper=document.createElement("section");
  wrapper.className="page"+(page.id===activeTabId?" active":"");
  wrapper.dataset.pageId=page.id;
  if(page.newTab){
   wrapper.innerHTML=`
    <div class="newtab-page">
     <div class="newtab-overlay"><div class="newtab-center">
      <div class="veil-mark">${tabIcon()}</div>
      <div class="newtab-title">Veil</div>
      <div class="newtab-subtitle">A clean, private browsing interface</div>
      <div class="search-box"><span>⌕</span><input class="newtab-search" data-page="${page.id}" placeholder="Search or enter address" autocomplete="off" spellcheck="false"></div>
      <div class="quick-links">
       <button class="quick-link" data-url="https://www.google.com">Google</button>
       <button class="quick-link" data-url="https://www.youtube.com">YouTube</button>
       <button class="quick-link" data-action="bookmarks">Bookmarks</button>
       <button class="quick-link" data-action="settings">Settings</button>
      </div>
     </div></div>
    </div>`;
  }else{
   const frame=document.createElement("div");
   frame.style.width="100%";frame.style.height="100%";
   frame.dataset.engineContainer=page.id;
   wrapper.appendChild(frame);
   createEngineFrame(page,frame);
  }
  viewport.appendChild(wrapper);
 });
 applyNewTabBackground();
 viewport.querySelectorAll(".newtab-search").forEach(input=>input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){activeTabId=input.dataset.page;navigate(input.value)}
 }));
 viewport.querySelectorAll(".quick-link").forEach(btn=>btn.addEventListener("click",()=>{
  if(btn.dataset.url){activeTabId=btn.closest(".page").dataset.pageId;navigate(btn.dataset.url)}
  else if(btn.dataset.action==="bookmarks")openPanel("bookmarksPanel");
  else if(btn.dataset.action==="settings")openPanel("settingsPanel");
 }));
}

function renderToolbar(){
 const page=getActiveTab(),address=document.getElementById("address");
 address.value=page&&page.url?page.url:"";
 document.getElementById("backBtn").disabled=!page||page.historyIndex<=0;
 document.getElementById("forwardBtn").disabled=!page||page.historyIndex>=page.history.length-1;
 const b=document.getElementById("bookmarkBtn");
 if(page&&page.url&&isBookmarked(page.url)){b.classList.add("saved");b.textContent="★"}else{b.classList.remove("saved");b.textContent="☆"}
}

function render(){renderTabs();renderViewport();renderToolbar();renderBookmarks();loadColorInputs();loadCloakInputs()}

async function navigate(raw){
 const page=getActiveTab();if(!page)return;
 const value=normalizeUrl(raw);if(!value)return;
 page.newTab=false;
 if(page.historyIndex<page.history.length-1)page.history=page.history.slice(0,page.historyIndex+1);
 page.history.push(value);page.historyIndex=page.history.length-1;page.url=value;
 try{page.title=new URL(value).hostname}catch{page.title="Veil"}
 render();
 await initEngine();
}

async function goBack(){
 const p=getActiveTab();if(!p||p.historyIndex<=0)return;
 p.historyIndex--;p.url=p.history[p.historyIndex];p.newTab=false;render();
 await navigateExisting(p);
}
async function goForward(){
 const p=getActiveTab();if(!p||p.historyIndex>=p.history.length-1)return;
 p.historyIndex++;p.url=p.history[p.historyIndex];p.newTab=false;render();
 await navigateExisting(p);
}
async function navigateExisting(page){
 if(!engineReady){await initEngine()}
 if(page.engineFrame&&typeof page.engineFrame.go==="function"){page.engineFrame.go(page.url);return}
 const wrapper=document.querySelector(`[data-engine-container="${page.id}"]`);
 if(wrapper){wrapper.innerHTML="";await createEngineFrame(page,wrapper)}
}
function reload(){
 const p=getActiveTab();if(!p||!p.url)return;
 if(p.engineFrame&&typeof p.engineFrame.reload==="function")p.engineFrame.reload();
 else if(p.engineFrame&&p.engineFrame.element instanceof HTMLIFrameElement)p.engineFrame.element.contentWindow.location.reload();
 else navigateExisting(p);
}
function createTab(newTab=true){
 const tab={id:uid(),title:newTab?"New Tab":"Veil",url:"",history:[],historyIndex:-1,newTab,animOpen:true,engineFrame:null};
 tabs.push(tab);activeTabId=tab.id;render();
 requestAnimationFrame(()=>document.querySelector(`[data-tab-id="${tab.id}"]`)?.classList.add("opening"));
}
function closeTab(id){
 const index=tabs.findIndex(t=>t.id===id);if(index<0)return;
 const el=document.querySelector(`[data-tab-id="${id}"]`);
 if(el){
  el.classList.add("closing");
  setTimeout(()=>finishClose(index,id),160);
 }else finishClose(index,id);
}
function finishClose(index,id){
 const currentIndex=tabs.findIndex(t=>t.id===id);if(currentIndex<0)return;
 tabs.splice(currentIndex,1);
 if(!tabs.length){createTab(true);return}
 if(activeTabId===id){
  const next=tabs[Math.min(currentIndex,tabs.length-1)];
  activeTabId=next.id;
 }
 render();
}
function renameCurrentTab(id=activeTabId){
 const p=getTab(id);if(!p)return;
 const name=prompt("Enter a name for this tab:",p.title);
 if(name&&name.trim()){p.title=name.trim();render()}
}
function toggleBookmark(){
 const p=getActiveTab();if(!p||!p.url)return;
 const existing=bookmarks.find(b=>b.url===p.url);
 if(existing)bookmarks=bookmarks.filter(b=>b.url!==p.url);
 else bookmarks.push({id:uid(),title:p.title||p.url,url:p.url});
 save();render();
}
function renderBookmarks(){
 const list=document.getElementById("bookmarkList");
 if(!bookmarks.length){list.innerHTML='<div class="empty">No bookmarks yet.</div>';return}
 list.innerHTML=bookmarks.map(b=>`<div class="bookmark-row"><div class="bookmark-main" data-open-bookmark="${escapeHTML(b.url)}"><div class="bookmark-title">${escapeHTML(b.title)}</div><div class="bookmark-url">${escapeHTML(b.url)}</div></div><button class="bookmark-delete" data-delete-bookmark="${escapeHTML(b.id)}">×</button></div>`).join("");
 list.querySelectorAll("[data-open-bookmark]").forEach(el=>el.onclick=()=>{closePanels();navigate(el.dataset.openBookmark)});
 list.querySelectorAll("[data-delete-bookmark]").forEach(el=>el.onclick=()=>{bookmarks=bookmarks.filter(b=>b.id!==el.dataset.deleteBookmark);save();renderBookmarks();renderToolbar()});
}

function openPanel(id){closeMenu();document.getElementById("backdrop").classList.add("open");document.getElementById(id).classList.add("open")}
function closePanels(){document.getElementById("backdrop").classList.remove("open");document.querySelectorAll(".panel").forEach(p=>p.classList.remove("open"))}
function closeMenu(){document.getElementById("mainMenu").classList.remove("open")}
function loadColorInputs(){
 document.getElementById("colorBg").value=settings.bg;
 document.getElementById("colorPanel").value=settings.panel;
 document.getElementById("colorAccent").value=settings.accent;
 document.getElementById("colorText").value=settings.text;
}
function loadCloakInputs(){
 document.getElementById("cloakTitle").value=cloak.title||"";
 document.getElementById("cloakIcon").value=cloak.icon||"";
}
function applyTheme(name){if(!THEMES[name])return;settings={...settings,...THEMES[name],theme:name};applyCSSVariables();save();render()}
function applyCustomColors(){
 settings.bg=document.getElementById("colorBg").value;settings.panel=document.getElementById("colorPanel").value;settings.accent=document.getElementById("colorAccent").value;settings.text=document.getElementById("colorText").value;
 settings.bg2=settings.bg2||settings.bg;settings.bg3=settings.bg3||settings.panel;settings.panel2=settings.panel2||settings.panel;settings.border=settings.border||"#2b2b2b";settings.muted=settings.muted||"#888";settings.accentText=settings.accentText||"#111";settings.newtab=settings.bg;
 applyCSSVariables();save();render();
}
function applyBackground(){settings.backgroundUrl=document.getElementById("backgroundUrl").value.trim();save();render()}
function applyCloak(){
 cloak.title=document.getElementById("cloakTitle").value.trim()||"Veil";
 cloak.icon=document.getElementById("cloakIcon").value.trim();
 document.title=cloak.title;
 if(cloak.icon)document.getElementById("favicon").href=cloak.icon;
 save();
}
function resetSettings(){
 settings={...DEFAULT_SETTINGS};cloak={title:"Veil",icon:""};document.title="Veil";
 document.getElementById("favicon").href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101010'/%3E%3Cpath d='M50 15L80 28V48C80 69 67 84 50 90C33 84 20 69 20 48V28L50 15Z' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E";
 applyCSSVariables();save();render();
}

document.getElementById("newTabBtn").onclick=()=>createTab(true);
document.getElementById("backBtn").onclick=goBack;
document.getElementById("forwardBtn").onclick=goForward;
document.getElementById("refreshBtn").onclick=reload;
document.getElementById("bookmarkBtn").onclick=toggleBookmark;
document.getElementById("address").addEventListener("keydown",e=>{if(e.key==="Enter")navigate(e.target.value)});
document.getElementById("menuBtn").onclick=e=>{e.stopPropagation();document.getElementById("mainMenu").classList.toggle("open")};
document.getElementById("menuNewTab").onclick=()=>{closeMenu();createTab(true)};
document.getElementById("menuBookmark").onclick=()=>{toggleBookmark();closeMenu()};
document.getElementById("menuBookmarks").onclick=()=>openPanel("bookmarksPanel");
document.getElementById("menuRename").onclick=()=>{closeMenu();renameCurrentTab()};
document.getElementById("menuSettings").onclick=()=>openPanel("settingsPanel");
document.getElementById("backdrop").onclick=closePanels;
document.querySelectorAll("[data-close-panel]").forEach(b=>b.onclick=closePanels);
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));
document.getElementById("applyColors").onclick=applyCustomColors;
document.getElementById("applyBackground").onclick=applyBackground;
document.getElementById("applyCloak").onclick=applyCloak;
document.getElementById("resetSettings").onclick=resetSettings;
document.addEventListener("click",e=>{
 if(!e.target.closest("#mainMenu")&&!e.target.closest("#menuBtn"))closeMenu();
});
document.addEventListener("keydown",e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==="l"){e.preventDefault();document.getElementById("address").focus();document.getElementById("address").select()}
 if(mod&&e.key.toLowerCase()==="t"){e.preventDefault();createTab(true)}
 if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();if(activeTabId)closeTab(activeTabId)}
 if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();toggleBookmark()}
 if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();goBack()}
 if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();goForward()}
 if(mod&&e.key.toLowerCase()==="r"){e.preventDefault();reload()}
});
window.addEventListener("beforeunload",()=>{if(COOKIE.consent)save()});

function showCookieConsent(){
 const overlay=document.createElement("div");
 overlay.className="cookie-overlay";
 overlay.innerHTML=`<div class="cookie-box">
  <div class="cookie-logo"><svg viewBox="0 0 100 100" fill="none"><path d="M50 12L82 26V47C82 69 68 85 50 91C32 85 18 69 18 47V26L50 12Z" stroke="currentColor" stroke-width="7"/></svg></div>
  <h2>Allow cookies?</h2>
  <p>Veil can use cookies to remember your bookmarks, appearance, background, and other browser preferences.<br><br>If you choose No, Veil will still work, but nothing will be saved between visits.</p>
  <div class="cookie-buttons"><button class="cookie-no" id="cookieNo">No</button><button class="cookie-yes" id="cookieYes">Yes</button></div>
 </div>`;
 document.body.appendChild(overlay);
 document.getElementById("cookieYes").onclick=()=>{
  COOKIE.consent=true;COOKIE.set("veil_cookie_consent","yes");loadSavedData();save();overlay.remove();applyCSSVariables();document.title=cloak.title||"Veil";if(cloak.icon)document.getElementById("favicon").href=cloak.icon;render();
 };
 document.getElementById("cookieNo").onclick=()=>{COOKIE.consent=false;overlay.remove();render()};
}

(async function init(){
 const consent=COOKIE.get("veil_cookie_consent");
 if(consent==="yes"){COOKIE.consent=true;loadSavedData()}
 applyCSSVariables();document.title=cloak.title||"Veil";if(cloak.icon)document.getElementById("favicon").href=cloak.icon;
 createTab(true);
 initEngine();
 if(consent!=="yes")showCookieConsent();
})();
</script>
</body>
</html>
