<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Veil</title>

<link
    id="favicon"
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101010'/%3E%3Cpath d='M50 15L80 28V48C80 69 67 84 50 90C33 84 20 69 20 48V28L50 15Z' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E"
>

<style>

:root {
    --bg: #101010;
    --bg2: #151515;
    --bg3: #1b1b1b;
    --panel: #181818;
    --panel2: #202020;
    --border: #2b2b2b;
    --text: #f2f2f2;
    --muted: #888888;
    --accent: #ffffff;
    --accentText: #111111;
    --danger: #ff5d5d;
    --newtab: #101010;
}

/* =========================
   GLOBAL RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    /* Prevent the dark edge/gradient shown in the screenshot */
    background: var(--bg);
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    outline: none;
}

button:focus,
input:focus {
    outline: none;
}


/* =========================
   MAIN BROWSER
========================= */

#browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
}


/* =========================
   CHROME
========================= */

.chrome {
    width: 100%;
    flex-shrink: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);

    /* No large shadow that can create the black edge */
    box-shadow: none;

    position: relative;
    z-index: 100;
}


/* =========================
   TABS
========================= */

.tabs-row {
    width: 100%;
    height: 42px;

    display: flex;
    align-items: flex-end;

    padding:
        0
        7px
        0
        7px;

    gap: 4px;

    overflow: hidden;
}


/*
    IMPORTANT:

    The tabs container no longer takes the + button away
    from the end.

    The + button is now immediately after the last tab,
    exactly like a normal browser.
*/

.tabs {
    height: 100%;

    display: flex;
    align-items: flex-end;

    gap: 4px;

    min-width: 0;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
    display: none;
}


/* =========================
   INDIVIDUAL TAB
========================= */

.tab {
    height: 36px;

    min-width: 145px;
    max-width: 235px;

    flex: 0 0 auto;

    display: flex;
    align-items: center;

    gap: 8px;

    padding:
        0
        8px
        0
        11px;

    border-radius:
        9px
        9px
        0
        0;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    user-select: none;

    position: relative;

    transition:
        background .14s ease,
        color .14s ease;
}

.tab:hover {
    background: var(--bg3);
    color: var(--text);
}

.tab.active {
    background: var(--panel);
    color: var(--text);
}


/* =========================
   TAB ICON
========================= */

.tab-icon {
    width: 16px;
    height: 16px;

    flex: 0 0 16px;

    border-radius: 4px;

    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    /*
        Prevent the little favicon artifact
        from overflowing the tab.
    */
    line-height: 0;
}

.tab-icon img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.default-tab-icon {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--accent);

    display: block;
}


/* =========================
   TAB TITLE
========================= */

.tab-title {
    flex: 1;

    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 12px;

    line-height: 1;
}


/* =========================
   TAB CLOSE
========================= */

.tab-close {
    width: 21px;
    height: 21px;

    flex: 0 0 21px;

    border-radius: 5px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15px;

    line-height: 1;
}

.tab-close:hover {
    background: var(--panel2);
    color: var(--text);
}


/* =========================
   NEW TAB BUTTON
========================= */

.new-tab {
    width: 32px;
    height: 32px;

    flex: 0 0 32px;

    margin-bottom: 2px;

    border-radius: 8px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    line-height: 1;

    transition:
        background .14s ease,
        color .14s ease;
}

.new-tab:hover {
    background: var(--panel2);
    color: var(--text);
}


/* =========================
   TOOLBAR
========================= */

.toolbar {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;

    gap: 6px;

    padding:
        6px
        9px;

    background: var(--panel);

    overflow: hidden;
}


/* =========================
   NAV BUTTONS
========================= */

.nav-buttons {
    display: flex;
    gap: 2px;

    flex: 0 0 auto;
}

.tool-btn {
    width: 35px;
    height: 35px;

    border-radius: 8px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;

    transition:
        background .14s ease,
        color .14s ease;
}

.tool-btn:hover {
    background: var(--panel2);
    color: var(--text);
}

.tool-btn:disabled {
    opacity: .28;
    cursor: default;
}


/* =========================
   ADDRESS BAR
========================= */

.address-wrap {
    flex: 1;

    min-width: 0;

    height: 35px;

    display: flex;
    align-items: center;

    border-radius: 18px;

    background: var(--bg2);

    border: 1px solid var(--border);

    padding:
        0
        7px
        0
        13px;

    transition:
        border-color .14s ease,
        background .14s ease;
}

.address-wrap:focus-within {
    border-color: #444;
    background: var(--bg3);
}

.address-icon {
    color: var(--muted);

    margin-right: 8px;

    font-size: 14px;

    flex: 0 0 auto;
}

#address {
    flex: 1;

    min-width: 0;

    border: 0;

    background: transparent;

    color: var(--text);

    font-size: 13px;
}

#address::placeholder {
    color: #666;
}


/* =========================
   BOOKMARK BUTTON
========================= */

.address-bookmark {
    width: 29px;
    height: 29px;

    flex: 0 0 29px;

    border-radius: 50%;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
}

.address-bookmark:hover {
    background: var(--panel2);
    color: var(--text);
}

.address-bookmark.saved {
    color: var(--accent);
}


/* =========================
   THREE DOT BUTTON
========================= */

.menu-btn {
    width: 36px;
    height: 36px;

    flex: 0 0 36px;

    border-radius: 9px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;

    line-height: 1;

    letter-spacing: 1px;
}

.menu-btn:hover {
    background: var(--panel2);
    color: var(--text);
}


/* =========================
   VIEWPORT
========================= */

.viewport {
    position: relative;

    flex: 1;

    min-height: 0;

    width: 100%;

    background: var(--bg);

    overflow: hidden;
}

.page {
    width: 100%;
    height: 100%;

    display: none;

    background: var(--bg);
}

.page.active {
    display: block;
}


/* =========================
   ENGINE FRAME
========================= */

.engine-frame {
    width: 100%;
    height: 100%;

    display: block;

    border: 0;

    background: #ffffff;
}


/* =========================
   NEW TAB
========================= */

.newtab-page {
    width: 100%;
    height: 100%;

    overflow: auto;

    background-color: var(--newtab);

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    position: relative;
}

.newtab-overlay {
    width: 100%;
    min-height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 40px 20px;

    background: rgba(0,0,0,.08);
}

.newtab-center {
    width: min(700px,100%);

    text-align: center;
}

.veil-mark {
    width: 74px;
    height: 74px;

    margin:
        0
        auto
        22px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.28);
}

.veil-mark svg {
    width: 42px;
    height: 42px;
}

.newtab-title {
    font-size:
        clamp(
            42px,
            7vw,
            70px
        );

    font-weight: 700;

    letter-spacing: -3px;

    line-height: 1;
}

.newtab-subtitle {
    color: var(--muted);

    margin-top: 12px;

    font-size: 14px;
}

.search-box {
    width: min(620px,100%);

    height: 54px;

    margin:
        30px
        auto
        0;

    border-radius: 17px;

    background:
        rgba(20,20,20,.90);

    border:
        1px solid
        var(--border);

    display: flex;
    align-items: center;

    padding:
        0
        18px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.20);
}

.search-box span {
    color: var(--muted);

    margin-right: 11px;
}

.search-box input {
    flex: 1;

    min-width: 0;

    border: 0;

    background: transparent;

    color: var(--text);

    font-size: 14px;
}

.quick-links {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;

    margin-top: 22px;
}

.quick-link {
    border:
        1px solid
        var(--border);

    background:
        rgba(20,20,20,.72);

    color: var(--muted);

    padding:
        9px
        13px;

    border-radius: 11px;

    cursor: pointer;

    font-size: 12px;
}

.quick-link:hover {
    color: var(--text);

    background: var(--panel2);
}


/* =========================
   THREE DOT MENU
========================= */

.menu {
    position: fixed;

    top: 94px;

    right: 10px;

    width: 245px;

    background: var(--panel);

    border:
        1px solid
        var(--border);

    border-radius: 13px;

    padding: 7px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.45);

    z-index: 1000;

    display: none;
}

.menu.open {
    display: block;
}

.menu-item {
    width: 100%;
    height: 38px;

    padding:
        0
        11px;

    border-radius: 8px;

    background: transparent;

    color: var(--text);

    display: flex;
    align-items: center;

    gap: 11px;

    cursor: pointer;

    text-align: left;

    font-size: 13px;
}

.menu-item:hover {
    background: var(--panel2);
}

.menu-icon {
    width: 20px;

    text-align: center;

    color: var(--muted);
}

.menu-separator {
    height: 1px;

    background: var(--border);

    margin:
        6px
        4px;
}


/* =========================
   PANELS
========================= */

.backdrop {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    z-index: 1100;

    display: none;
}

.backdrop.open {
    display: block;
}

.panel {
    position: fixed;

    right: 0;
    top: 0;

    height: 100%;

    width: min(430px,100%);

    background: var(--panel);

    border-left:
        1px solid
        var(--border);

    z-index: 1200;

    transform:
        translateX(100%);

    transition:
        transform .22s ease;

    box-shadow:
        -20px
        0
        60px
        rgba(0,0,0,.40);

    display: flex;

    flex-direction: column;
}

.panel.open {
    transform:
        translateX(0);
}

.panel-header {
    height: 65px;

    padding:
        0
        20px;

    border-bottom:
        1px solid
        var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.panel-header h2 {
    font-size: 17px;
}

.close-panel {
    width: 32px;
    height: 32px;

    border-radius: 8px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 20px;
}

.close-panel:hover {
    background: var(--panel2);
    color: var(--text);
}

.panel-body {
    padding: 20px;

    overflow-y: auto;
}


/* =========================
   SETTINGS
========================= */

.setting-section {
    margin-bottom: 28px;
}

.setting-title {
    font-size: 12px;

    color: var(--muted);

    text-transform: uppercase;

    letter-spacing: .09em;

    margin-bottom: 11px;
}

.preset-grid {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 9px;
}

.preset {
    min-height: 67px;

    border:
        1px solid
        var(--border);

    background: var(--bg2);

    border-radius: 11px;

    cursor: pointer;

    text-align: left;

    padding: 10px;

    transition:
        border-color .14s ease,
        transform .14s ease;
}

.preset:hover {
    border-color: #555;

    transform:
        translateY(-1px);
}

.preset-name {
    font-size: 12px;

    margin-bottom: 9px;
}

.preset-preview {
    display: flex;

    gap: 5px;
}

.preset-dot {
    width: 14px;
    height: 14px;

    border-radius: 50%;
}

.input-row {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 9px;
}

.input-label {
    width: 90px;

    flex: 0 0 90px;

    font-size: 12px;

    color: var(--muted);
}

.text-input {
    flex: 1;

    min-width: 0;

    height: 36px;

    border-radius: 8px;

    border:
        1px solid
        var(--border);

    background: var(--bg2);

    color: var(--text);

    padding:
        0
        10px;

    font-size: 12px;
}

.color-input {
    width: 45px;
    height: 36px;

    padding: 3px;

    border-radius: 8px;

    border:
        1px solid
        var(--border);

    background: var(--bg2);

    cursor: pointer;
}

.primary-btn {
    width: 100%;

    height: 39px;

    border-radius: 9px;

    background: var(--accent);

    color: var(--accentText);

    cursor: pointer;

    font-size: 12px;

    font-weight: 600;
}

.primary-btn:hover {
    filter: brightness(.92);
}

.secondary-btn {
    width: 100%;

    height: 39px;

    border-radius: 9px;

    background: var(--panel2);

    color: var(--text);

    cursor: pointer;

    font-size: 12px;
}

.small-note {
    color: var(--muted);

    font-size: 11px;

    line-height: 1.5;

    margin-top: 8px;
}


/* =========================
   BOOKMARKS
========================= */

.bookmarks-empty {
    text-align: center;

    padding:
        35px
        15px;

    color: var(--muted);

    font-size: 13px;
}

.bookmark-row {
    display: flex;

    align-items: center;

    gap: 10px;

    border:
        1px solid
        var(--border);

    background: var(--bg2);

    border-radius: 10px;

    padding: 9px;

    margin-bottom: 7px;
}

.bookmark-info {
    flex: 1;

    min-width: 0;

    cursor: pointer;
}

.bookmark-name {
    font-size: 12px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.bookmark-url {
    font-size: 10px;

    color: var(--muted);

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    margin-top: 3px;
}

.bookmark-delete {
    width: 27px;
    height: 27px;

    border-radius: 7px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;
}

.bookmark-delete:hover {
    color: var(--danger);

    background:
        rgba(255,80,80,.08);
}


/* =========================
   COOKIE CONSENT
========================= */

.cookie-overlay {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.68);

    backdrop-filter:
        blur(5px);

    z-index: 5000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.cookie-box {
    width: min(430px,100%);

    background: var(--panel);

    border:
        1px solid
        var(--border);

    border-radius: 16px;

    padding: 25px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);
}

.cookie-logo {
    width: 48px;
    height: 48px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.055);

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 17px;
}

.cookie-logo svg {
    width: 28px;
    height: 28px;
}

.cookie-box h2 {
    font-size: 19px;

    margin-bottom: 9px;
}

.cookie-box p {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.65;
}

.cookie-buttons {
    display: flex;

    gap: 9px;

    margin-top: 20px;
}

.cookie-buttons button {
    flex: 1;

    height: 40px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 600;
}

.cookie-yes {
    background: var(--accent);

    color: var(--accentText);
}

.cookie-no {
    background: var(--panel2);

    color: var(--text);
}

.cookie-no:hover {
    background: #292929;
}


/* =========================
   MOBILE
========================= */

@media (max-width:650px) {

    .tab {
        min-width: 125px;
    }

    .nav-buttons .tool-btn {
        width: 31px;
    }

    .toolbar {
        gap: 3px;
    }

    .newtab-title {
        letter-spacing: -2px;
    }

}

</style>
</head>

<body>

<div id="browser">

    <header class="chrome">

        <!-- TABS -->

        <div class="tabs-row">

            <div
                class="tabs"
                id="tabs"
            ></div>

            <!-- This is now directly beside the last tab -->

            <button
                class="new-tab"
                id="newTabBtn"
                title="New tab"
            >
                +
            </button>

        </div>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="nav-buttons">

                <button
                    class="tool-btn"
                    id="backBtn"
                    title="Back"
                >
                    ←
                </button>

                <button
                    class="tool-btn"
                    id="forwardBtn"
                    title="Forward"
                >
                    →
                </button>

                <button
                    class="tool-btn"
                    id="refreshBtn"
                    title="Refresh"
                >
                    ↻
                </button>

            </div>


            <div class="address-wrap">

                <span
                    class="address-icon"
                >
                    ⌕
                </span>

                <input
                    id="address"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Search or enter address"
                >

                <button
                    class="address-bookmark"
                    id="bookmarkBtn"
                    title="Bookmark"
                >
                    ☆
                </button>

            </div>


            <button
                class="menu-btn"
                id="menuBtn"
                title="Menu"
            >
                ⋮
            </button>

        </div>

    </header>


    <main
        class="viewport"
        id="viewport"
    ></main>

</div>


<!-- =========================
     THREE DOT MENU
========================= -->

<div
    class="menu"
    id="mainMenu"
>

    <button
        class="menu-item"
        id="menuNewTab"
    >
        <span class="menu-icon">＋</span>
        New tab
    </button>

    <button
        class="menu-item"
        id="menuBookmark"
    >
        <span class="menu-icon">☆</span>
        Bookmark this page
    </button>

    <div class="menu-separator"></div>

    <button
        class="menu-item"
        id="menuBookmarks"
    >
        <span class="menu-icon">★</span>
        Bookmarks
    </button>

    <button
        class="menu-item"
        id="menuRename"
    >
        <span class="menu-icon">✎</span>
        Rename current tab
    </button>

    <div class="menu-separator"></div>

    <button
        class="menu-item"
        id="menuSettings"
    >
        <span class="menu-icon">⚙</span>
        Settings
    </button>

</div>


<!-- =========================
     PANEL BACKDROP
========================= -->

<div
    class="backdrop"
    id="backdrop"
></div>


<!-- =========================
     SETTINGS PANEL
========================= -->

<aside
    class="panel"
    id="settingsPanel"
>

    <div class="panel-header">

        <h2>Settings</h2>

        <button
            class="close-panel"
            data-close-panel
        >
            ×
        </button>

    </div>


    <div class="panel-body">


        <!-- THEMES -->

        <section class="setting-section">

            <div class="setting-title">
                Themes
            </div>


            <div class="preset-grid">


                <button
                    class="preset"

/*

The UI is independent from the browsing engine.

Connect your engine here later.

*/

/* ======================================================
   COOKIE SYSTEM
====================================================== */

const COOKIE = {

    consent: false,


    set(name, value, days = 365) {

        if (!this.consent) {
            return;
        }

        const expires =
            new Date(
                Date.now() +
                days * 86400000
            ).toUTCString();

        document.cookie =
            encodeURIComponent(name) +
            "=" +
            encodeURIComponent(value) +
            "; expires=" +
            expires +
            "; path=/; SameSite=Lax";
    },


    get(name) {

        const target =
            encodeURIComponent(name) +
            "=";

        const parts =
            document.cookie.split("; ");

        for (const part of parts) {

            if (
                part.startsWith(target)
            ) {

                return decodeURIComponent(
                    part.slice(target.length)
                );
            }
        }

        return null;
    },


    remove(name) {

        if (!this.consent) {
            return;
        }

        document.cookie =
            encodeURIComponent(name) +
            "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax";
    }

};


/* ======================================================
   COOKIE STORAGE KEYS
====================================================== */

const STORAGE = {

    bookmarks:
        "veil_bookmarks",

    cloak:

/* ======================================================
   DEFAULT SETTINGS

const DEFAULT_SETTINGS = {

/* ======================================================
   STATE
====================================================== */

let tabs = [];

let activeTabId = null;

let bookmarks = [];

let settings = {
    ...DEFAULT_SETTINGS
};

let cloak = {

    title: "Veil",

    icon: ""

};


/* ======================================================
   TEMPORARY TAB STATE

   Tabs are intentionally held in memory.

   This means that selecting "No" for cookies means
   nothing is persisted between visits.
====================================================== */


/* ======================================================
   ID
====================================================== */

function uid() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2,8)
    );

}


/* ======================================================
   SAVE
====================================================== */

function save() {

    if (!COOKIE.consent) {
        return;
    }


    COOKIE.set(
        STORAGE.bookmarks,
        JSON.stringify(bookmarks)
    );


    COOKIE.set(
        STORAGE.settings,
        JSON.stringify(settings)
    );


    COOKIE.set(
        STORAGE.cloak,
        JSON.stringify(cloak)
    );

}


/* ======================================================
   LOAD COOKIES
====================================================== */

function loadSavedData() {

    if (!COOKIE.consent) {
        return;
    }


    try {

        const savedBookmarks =
            COOKIE.get(
                STORAGE.bookmarks
            );

        if (savedBookmarks) {

            bookmarks =
                JSON.parse(
                    savedBookmarks
                );

        }

    } catch {

        bookmarks = [];

    }


    try {

        const savedSettings =
            COOKIE.get(
                STORAGE.settings
            );

        if (savedSettings) {

            settings = {

                ...DEFAULT_SETTINGS,

                ...JSON.parse(
                    savedSettings
                )

            };

        }

    } catch {

        settings = {
            ...DEFAULT_SETTINGS
        };

    }


    try {

        const savedCloak =
            COOKIE.get(
                STORAGE.cloak
            );

        if (savedCloak) {

            cloak =
                JSON.parse(
                    savedCloak
                );

        }

    } catch {

        cloak = {
            title: "Veil",
            icon: ""
        };

    }

}


/* ======================================================
   CREATE TAB
====================================================== */

function createTab(select = true) {

    const page = {

        id: uid(),

        title: "New Tab",

        url: "",

        history: [],

        historyIndex: -1,

        newTab: true

    };


    tabs.push(page);


    if (select) {

        activeTabId =
            page.id;

    }


    render();

}


/* ======================================================
   CLOSE TAB
====================================================== */

function closeTab(id) {

    const index =
        tabs.findIndex(
            tab =>
                tab.id === id
        );


    if (index === -1) {
        return;
    }


    tabs.splice(index,1);


    if (!tabs.length) {

        createTab(true);

        return;

    }


    if (activeTabId === id) {

        const next =
            tabs[index] ||
            tabs[index - 1] ||
            tabs[0];

        activeTabId =
            next.id;

    }


    render();

}


/* ======================================================
   ACTIVE TAB
====================================================== */

function getActiveTab() {

    return tabs.find(
        tab =>
            tab.id === activeTabId
    );

}


/* ======================================================
   NAVIGATION
====================================================== */

function navigate(input) {

    const page =
        getActiveTab();


    if (!page) {
        return;
    }


    let value =
        input.trim();


    if (!value) {
        return;
    }


    if (
        !/^https?:\/\//i.test(
            value
        )
    ) {

        if (
            value.includes(".") &&
            !value.includes(" ")
        ) {

            value =
                "https://" +
                value;

        } else {

            value =
                "https://www.google.com/search?q=" +
                encodeURIComponent(
                    value
                );

        }

    }


    page.newTab = false;

    page.url = value;


    if (
        page.historyIndex <
        page.history.length - 1
    ) {

        page.history =
            page.history.slice(
                0,
                page.historyIndex + 1
            );

    }


    page.history.push(
        value
    );


    page.historyIndex =
        page.history.length - 1;


    try {

        page.title =
            new URL(
                value
            ).hostname;

    } catch {

        page.title =
            "Veil";

    }


    render();


    VEIL_ENGINE.navigate(
        value,
        page
    );

}


/* ======================================================
   BACK
====================================================== */

function goBack() {

    const page =
        getActiveTab();


    if (!page) {
        return;
    }


    if (
        page.historyIndex > 0
    ) {

        page.historyIndex--;

        page.url =
            page.history[
                page.historyIndex
            ];

        page.newTab = false;


        render();


        VEIL_ENGINE.navigate(
            page.url,
            page
        );

    }

}


/* ======================================================
   FORWARD
====================================================== */

function goForward() {

    const page =
        getActiveTab();


    if (!page) {
        return;
    }


    if (
        page.historyIndex <
        page.history.length - 1
    ) {

        page.historyIndex++;

        page.url =
            page.history[
                page.historyIndex
            ];

        page.newTab = false;


        render();


        VEIL_ENGINE.navigate(
            page.url,
            page
        );

    }

}


/* ======================================================
   RELOAD
====================================================== */

function reload() {

    const page =
        getActiveTab();


    if (
        page &&
        page.url
    ) {

        VEIL_ENGINE.reload(
            page
        );

    }

}


/* ======================================================
   RENAME
====================================================== */

function renameCurrentTab() {

    const page =
        getActiveTab();


    if (!page) {
        return;
    }


    const name =
        prompt(
            "Enter a name for this tab:",
            page.title
        );


    if (
        name !== null &&
        name.trim()
    ) {

        page.title =
            name.trim();

        render();

    }

}


/* ======================================================
   BOOKMARKS
====================================================== */

function toggleBookmark() {

    const page =
        getActiveTab();


    if (
        !page ||
        !page.url
    ) {

        return;

    }


    const existing =
        bookmarks.find(
            bookmark =>
                bookmark.url ===
                page.url
        );


    if (existing) {

        bookmarks =
            bookmarks.filter(
                bookmark =>
                    bookmark.url !==
                    page.url
            );

    } else {

        bookmarks.push({

            id: uid(),

            title:
                page.title ||
                page.url,

            url:
                page.url

        });

    }


    save();

    render();

    renderBookmarks();

}


/* ======================================================
   BOOKMARK CHECK
====================================================== */

function isBookmarked(url) {

    return bookmarks.some(
        bookmark =>
            bookmark.url === url
    );

}


/* ======================================================
   ESCAPE
====================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ======================================================
   RENDER TABS
====================================================== */

function renderTabs() {

    const container =
        document.getElementById(
            "tabs"
        );


    container.innerHTML =
        tabs.map(
            tab => `

            <div
                class="tab ${
                    tab.id === activeTabId
                        ? "active"
                        : ""
                }"
                data-tab-id="${tab.id}"
            >

                <div class="tab-icon">

                    <span class="default-tab-icon"></span>

                </div>

                <div class="tab-title">

                    ${escapeHTML(
                        tab.title
                    )}

                </div>

                <button
                    class="tab-close"
                    data-close-tab="${tab.id}"
                >
                    ×
                </button>

            </div>

        `
        ).join("");


    container
        .querySelectorAll(
            "[data-tab-id]"
        )
        .forEach(
            tabElement => {

                tabElement.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                "[data-close-tab]"
                            )
                        ) {

                            return;

                        }


                        activeTabId =
                            tabElement.dataset.tabId;


                        render();

                    }
                );

            }
        );


    container
        .querySelectorAll(
            "[data-close-tab]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        closeTab(
                            button.dataset.closeTab
                        );

                    }
                );

            }
        );

}


/* ======================================================
   RENDER VIEWPORT
====================================================== */

function renderViewport() {

    const viewport =
        document.getElementById(
            "viewport"
        );


    viewport.innerHTML = "";


    tabs.forEach(
        page => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "page" +
                (
                    page.id === activeTabId
                        ? " active"
                        : ""
                );


            if (
                page.newTab ||
                !page.url
            ) {

                wrapper.innerHTML = `

                    <div
                        class="newtab-page"
                        id="newtab-${page.id}"
                    >

                        <div class="newtab-overlay">

                            <div class="newtab-center">

                                <div class="veil-mark">

                                        fill="none"

                                        <path
                                            d="M50 12L82 26V47C82 69 68 85 50 91C32 85 18 69 18 47V26L50 12Z"
                                            stroke="currentColor"
                                            stroke-width="6"
                                        />

                                        <path
                                            d="M37 50L46 59L65 39"
                                            stroke="currentColor"
                                            stroke-width="6"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        />

                                    </svg>

                                </div>


                                <h1 class="newtab-title">
                                    Veil
                                </h1>


                                <p class="newtab-subtitle">
                                    A quieter way to browse.
                                </p>


                                <div class="search-box">

                                    <span>
                                        ⌕
                                    </span>

                                    <input
                                        class="newtab-search"
                                        data-page="${page.id}"
                                        placeholder="Search or enter address"
                                        autocomplete="off"
                                    >

                                </div>


                                <div class="quick-links">

                                    <button
                                        class="quick-link"
                                        data-action="bookmarks"
                                    >
                                        Bookmarks
                                    </button>


                                    <button
                                        class="quick-link"
                                        data-action="settings"
                                    >
                                        Settings
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            } else {

                const frame =
                    document.createElement(
                        "iframe"
                    );


                frame.className =
                    "engine-frame";


                frame.setAttribute(
                    "data-veil-engine-frame",
                    page.id
                );


                frame.src =
                    "about:blank";


                wrapper.appendChild(
                    frame
                );

            }


            viewport.appendChild(
                wrapper
            );

        }
    );


    document
        .querySelectorAll(
            ".newtab-search"
        )
        .forEach(
            input => {

                input.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            activeTabId =
                                input.dataset.page;


                            navigate(
                                input.value
                            );

                        }

                    }
                );

            }
        );


    document
        .querySelectorAll(
            '[data-action="bookmarks"]'
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        openPanel(
                            "bookmarksPanel"
                        )
                );

            }
        );


    document
        .querySelectorAll(
            '[data-action="settings"]'
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        openPanel(
                            "settingsPanel"
                        )
                );

            }
        );


    applyNewTabBackground();

}


/* ======================================================
   TOOLBAR
====================================================== */

function renderToolbar() {

    const page =
        getActiveTab();


    const address =
        document.getElementById(
            "address"
        );


    address.value =
        page && page.url
            ? page.url
            : "";


    document.getElementById(
        "backBtn"
    ).disabled =
        !page ||
        page.historyIndex <= 0;


    document.getElementById(
        "forwardBtn"
    ).disabled =
        !page ||
        page.historyIndex >=
        page.history.length - 1;


    const bookmarkButton =
        document.getElementById(
            "bookmarkBtn"
        );


    if (
        page &&
        page.url &&
        isBookmarked(
            page.url
        )
    ) {

        bookmarkButton.classList.add(
            "saved"
        );

        bookmarkButton.textContent =
            "★";

    } else {

        bookmarkButton.classList.remove(
            "saved"
        );

        bookmarkButton.textContent =
            "☆";

    }

}


/* ======================================================
   RENDER
====================================================== */

function render() {

    renderTabs();

    renderViewport();

    renderToolbar();

}


/* ======================================================
   APPLY THEME
====================================================== */

function applyTheme(themeName) {

    const theme =
        THEMES[themeName];


    if (!theme) {
        return;
    }


    settings = {

        ...settings,

        ...theme,

        theme: themeName

    };


    applyCSSVariables();

    save();

}


/* ======================================================
   CSS VARIABLES
====================================================== */

function applyCSSVariables() {

    const root =
        document.documentElement;


    const keys = [

        "bg",
        "bg2",
        "bg3",
        "panel",
        "panel2",
        "border",
        "text",
        "muted",
        "accent",
        "accentText",
        "newtab"

    ];


    keys.forEach(
        key => {

            if (
                settings[key]
            ) {

                root.style.setProperty(
                    "--" + key,
                    settings[key]
                );

            }

        }
    );

}


/* ======================================================
   COLOR INPUTS
====================================================== */

function loadColorInputs() {

    document.getElementById(
        "colorBg"
    ).value =
        settings.bg ||
        "#101010";


    document.getElementById(
        "colorPanel"
    ).value =
        settings.panel ||
        "#181818";


    document.getElementById(
        "colorAccent"
    ).value =
        settings.accent ||
        "#ffffff";


    document.getElementById(
        "colorText"
    ).value =
        settings.text ||
        "#f2f2f2";

}


/* ======================================================
   CUSTOM COLORS
====================================================== */

function applyCustomColors() {

    settings.bg =
        document.getElementById(
            "colorBg"
        ).value;


    settings.panel =
        document.getElementById(
            "colorPanel"
        ).value;


    settings.accent =
        document.getElementById(
            "colorAccent"
        ).value;


    settings.text =
        document.getElementById(
            "colorText"
        ).value;


    settings.theme =
        "custom";


    applyCSSVariables();

    save();

}


/* ======================================================
   BACKGROUND
====================================================== */

function applyNewTabBackground() {

    document
        .querySelectorAll(
            ".newtab-page"
        )
        .forEach(
            page => {

                if (
                    settings.backgroundUrl
                ) {

                    page.style.backgroundImage =
                        `url("${settings.backgroundUrl}")`;

                } else {

                    page.style.backgroundImage =
                        "none";

                    page.style.backgroundColor =
                        settings.newtab ||
                        settings.bg ||
                        "#101010";

                }

            }
        );

}


function applyBackground() {

    settings.backgroundUrl =
        document.getElementById(
            "backgroundUrl"
        ).value.trim();


    save();

    applyNewTabBackground();

}


/* ======================================================
   CLOAK
====================================================== */

function applyCloak() {

    const title =
        document.getElementById(
            "cloakTitle"
        ).value.trim();


    const icon =
        document.getElementById(
            "cloakIcon"
        ).value.trim();


    cloak.title =
        title ||
        "Veil";


    cloak.icon =
        icon;


    document.title =
        cloak.title;


    const favicon =
        document.getElementById(
            "favicon"
        );


    if (icon) {

        favicon.href =
            icon;

    } else {

        favicon.href =
            "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101010'/%3E%3Cpath d='M50 15L80 28V48C80 69 67 84 50 90C33 84 20 69 20 48V28L50 15Z' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E";

    }


    save();

}


/* ======================================================
   PANELS
====================================================== */

function openPanel(id) {

    closeMenu();


    document
        .getElementById(
            "backdrop"
        )
        .classList.add(
            "open"
        );


    document
        .getElementById(
            id
        )
        .classList.add(
            "open"
        );


    if (
        id ===
        "bookmarksPanel"
    ) {

        renderBookmarks();

    }


    if (
        id ===
        "settingsPanel"
    ) {

        loadColorInputs();


        document.getElementById(
            "backgroundUrl"
        ).value =
            settings.backgroundUrl ||
            "";


        document.getElementById(
            "cloakTitle"
        ).value =
            cloak.title ||
            "Veil";


        document.getElementById(
            "cloakIcon"
        ).value =
            cloak.icon ||
            "";

    }

}


function closePanels() {

    document
        .querySelectorAll(
            ".panel"
        )
        .forEach(
            panel =>
                panel.classList.remove(
                    "open"
                )
        );


    document
        .getElementById(
            "backdrop"
        )
        .classList.remove(
            "open"
        );

}


/* ======================================================
   MENU
====================================================== */

function closeMenu() {

    document
        .getElementById(
            "mainMenu"
        )
        .classList.remove(
            "open"
        );

}


/* ======================================================
   BOOKMARK LIST
====================================================== */

function renderBookmarks() {

    const list =
        document.getElementById(
            "bookmarkList"
        );


    if (!bookmarks.length) {

        list.innerHTML = `

            <div class="bookmarks-empty">
                No bookmarks yet.
            </div>

        `;

        return;

    }


    list.innerHTML =
        bookmarks
            .map(
                bookmark => `

                <div class="bookmark-row">

                    <div
                        class="bookmark-info"
                        data-open-bookmark="${escapeHTML(
                            bookmark.url
                        )}"
                    >

                        <div class="bookmark-name">
                            ${escapeHTML(
                                bookmark.title
                            )}
                        </div>

                        <div class="bookmark-url">
                            ${escapeHTML(
                                bookmark.url
                            )}
                        </div>

                    </div>


                    <button
                        class="bookmark-delete"
                        data-delete-bookmark="${bookmark.id}"
                    >
                        ×
                    </button>

                </div>

            `
            )
            .join("");


    list
        .querySelectorAll(
            "[data-open-bookmark]"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        navigate(
                            element.dataset
                                .openBookmark
                        );

                        closePanels();

                    }
                );

            }
        );


    list
        .querySelectorAll(
            "[data-delete-bookmark]"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        bookmarks =
                            bookmarks.filter(
                                bookmark =>
                                    bookmark.id !==
                                    element.dataset
                                        .deleteBookmark
                            );


                        save();

                        renderBookmarks();

                        render();

                    }
                );

            }
        );

}


/* ======================================================
   RESET
====================================================== */

function resetSettings() {

    settings = {
        ...DEFAULT_SETTINGS
    };


    cloak = {

        title: "Veil",

        icon: ""

    };


    document.title =
        "Veil";


    applyTheme(
        "matte"
    );


    const favicon =
        document.getElementById(
            "favicon"
        );


    favicon.href =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101010'/%3E%3Cpath d='M50 15L80 28V48C80 69 67 84 50 90C33 84 20 69 20 48V28L50 15Z' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E";


    save();

    render();

}


/* ======================================================
   EVENTS
====================================================== */

document
    .getElementById(
        "newTabBtn"
    )
    .addEventListener(
        "click",
        () =>
            createTab(true)
    );


document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        goBack
    );


document
    .getElementById(
        "forwardBtn"
    )
    .addEventListener(
        "click",
        goForward
    );


document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        reload
    );


document
    .getElementById(
        "bookmarkBtn"
    )
    .addEventListener(
        "click",
        toggleBookmark
    );


document
    .getElementById(
        "address"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                navigate(
                    event.target.value
                );

            }

        }
    );


document
    .getElementById(
        "menuBtn"
    )
    .addEventListener(
        "click",
        event => {

            event.stopPropagation();


            document
                .getElementById(
                    "mainMenu"
                )
                .classList.toggle(
                    "open"
                );

        }
    );


document
    .getElementById(
        "menuNewTab"
    )
    .addEventListener(
        "click",
        () => {

            closeMenu();

            createTab(true);

        }
    );


document
    .getElementById(
        "menuBookmark"
    )
    .addEventListener(
        "click",
        () => {

            toggleBookmark();

            closeMenu();

        }
    );


document
    .getElementById(
        "menuBookmarks"
    )
    .addEventListener(
        "click",
        () =>
            openPanel(
                "bookmarksPanel"
            )
    );


document
    .getElementById(
        "menuRename"
    )
    .addEventListener(
        "click",
        () => {

            closeMenu();

            renameCurrentTab();

        }
    );


document
    .getElementById(
        "menuSettings"
    )
    .addEventListener(
        "click",
        () =>
            openPanel(
                "settingsPanel"
            )
    );


document
    .getElementById(
        "backdrop"
    )
    .addEventListener(
        "click",
        closePanels
    );


document
    .querySelectorAll(
        "[data-close-panel]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                closePanels
            );

        }
    );


document
    .querySelectorAll(
        "[data-theme]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    applyTheme(
                        button.dataset.theme
                    );

                    render();

                }
            );

        }
    );


document
    .getElementById(
        "applyColors"
    )
    .addEventListener(
        "click",
        () => {

            applyCustomColors();

            render();

        }
    );


document
    .getElementById(
        "applyBackground"
    )
    .addEventListener(
        "click",
        () => {

            applyBackground();

            render();

        }
    );


document
    .getElementById(
        "applyCloak"
    )
    .addEventListener(
        "click",
        applyCloak
    );


document
    .getElementById(
        "resetSettings"
    )
    .addEventListener(
        "click",
        resetSettings
    );


document.addEventListener(
    "click",
    event => {

        const menu =
            document.getElementById(
                "mainMenu"
            );


        if (
            !menu.contains(
                event.target
            ) &&
            !event.target.closest(
                "#menuBtn"
            )
        ) {

            closeMenu();

        }

    }
);


/* ======================================================
   KEYBOARD SHORTCUTS
====================================================== */

document.addEventListener(
    "keydown",
    event => {

        const modifier =
            event.ctrlKey ||
            event.metaKey;


        if (
            modifier &&
            event.key.toLowerCase() ===
            "l"
        ) {

            event.preventDefault();


            const address =
                document.getElementById(
                    "address"
                );


            address.focus();

            address.select();

        }


        if (
            modifier &&
            event.key.toLowerCase() ===
            "t"
        ) {

            event.preventDefault();

            createTab(true);

        }


        if (
            modifier &&
            event.key.toLowerCase() ===
            "w"
        ) {

            event.preventDefault();


            if (activeTabId) {

                closeTab(
                    activeTabId
                );

            }

        }


        if (
            modifier &&
            event.key.toLowerCase() ===
            "d"
        ) {

            event.preventDefault();

            toggleBookmark();

        }


        if (
            event.altKey &&
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            goBack();

        }


        if (
            event.altKey &&
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();

            goForward();

        }


        if (
            modifier &&
            event.key.toLowerCase() ===
            "r"
        ) {

            event.preventDefault();

            reload();

        }

    }
);


/* ======================================================
   COOKIE CONSENT
====================================================== */

function showCookieConsent() {

    /*
        No cookie is created before the user chooses.

        If they select No, consent remains false and
        nothing is persisted.
    */

    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "cookie-overlay";


    overlay.innerHTML = `

        <div class="cookie-box">

            <div class="cookie-logo">

                <svg
                    viewBox="0 0 100 100"
                    fill="none"
                >

                    <path
                        d="M50 12L82 26V47C82 69 68 85 50 91C32 85 18 69 18 47V26L50 12Z"
                        stroke="currentColor"
                        stroke-width="7"
                    />

                </svg>

            </div>


            <h2>
                Allow cookies?
            </h2>


            <p>
                Veil can use cookies to remember
                your bookmarks, appearance,
                background, and other browser
                preferences.
                <br><br>
                If you choose No, Veil will still
                work, but nothing will be saved
                between visits.
            </p>


            <div class="cookie-buttons">

                <button
                    class="cookie-no"
                    id="cookieNo"
                >
                    No
                </button>


                <button
                    class="cookie-yes"
                    id="cookieYes"
                >
                    Yes
                </button>

            </div>

        </div>

    `;


    document.body.appendChild(
        overlay
    );


    document
        .getElementById(
            "cookieYes"
        )
        .addEventListener(
            "click",
            () => {

                COOKIE.consent =
                    true;


                /*
                    The consent cookie is the
                    first cookie created.
                */

                COOKIE.set(
                    "veil_cookie_consent",
                    "yes"
                );


                loadSavedData();

                save();


                overlay.remove();

                applyCSSVariables();

                document.title =
                    cloak.title ||
                    "Veil";


                if (cloak.icon) {

                    document.getElementById(
                        "favicon"
                    ).href =
                        cloak.icon;

                }


                render();

            }
        );


    document
        .getElementById(
            "cookieNo"
        )
        .addEventListener(
            "click",
            () => {

                /*
                    IMPORTANT:

                    No cookie is created here.

                    COOKIE.consent remains false.

                    Therefore no settings,
                    bookmarks, or other data
                    will be saved.
                */

                COOKIE.consent =
                    false;


                overlay.remove();

                render();

            }
        );

}


/* ======================================================
   INITIALIZE
====================================================== */

(function init() {

    /*
        The consent cookie is the only thing
        checked before loading saved data.
    */

    const consent =
        COOKIE.get(
            "veil_cookie_consent"
        );


    if (
        consent ===
        "yes"
    ) {

        COOKIE.consent =
            true;

        loadSavedData();

    }


    applyCSSVariables();


    document.title =
        cloak.title ||
        "Veil";


    if (cloak.icon) {

        document.getElementById(
            "favicon"
        ).href =
            cloak.icon;

    }


    createTab(true);


    /*
        No consent cookie means the user
        has not accepted cookies yet.

        Show the popup without storing
        anything.
    */

    if (
        consent !==
        "yes"
    ) {

        showCookieConsent();

    }

})();

</script>
