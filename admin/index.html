<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil Admin</title>
  <link rel="icon" id="favicon" href="../image/favi.png" />
  <style>
    :root { --bg:#101010; --panel:#181818; --border:#2b2b2b; --text:#f0f0f0; --muted:#888; --accent:#fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .card h2 { font-size: 14px; margin-bottom: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    input, select, button {
      font: inherit; border-radius: 8px; border: 1px solid var(--border); background: #141414; color: var(--text);
      height: 40px; padding: 0 12px; width: 100%;
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: #fff; color: #111; border: 0; }
    button.primary:hover { filter: brightness(.95); }
    button.danger { background: #3a1515; border-color: #5a2020; color: #ffb0b0; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }
    .msg { font-size: 13px; min-height: 18px; margin-top: 8px; color: var(--muted); }
    .msg.ok { color: #9dff90; }
    .msg.err { color: #ff7b7b; }
    .view { display: none; }
    .view.show { display: block; }
    .user {
      border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer;
      background: #141414;
    }
    .user:hover, .user.open { border-color: #444; background: #1a1a1a; }
    .user-email { font-size: 14px; font-weight: 600; }
    .user-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px;
      background: #222; color: var(--muted);
    }
    .badge.pending { background: #3a3010; color: #ffd56b; }
    .badge.allowed { background: #1a3a20; color: #9dff90; }
    .badge.banned { background: #3a1515; color: #ff7b7b; }
    .badge.expired { background: #2a2a2a; color: #aaa; }
    .badge.unverified { background: #1a2a3a; color: #7eb8ff; }
    .badge.google { background: #222; color: #bbb; }
    .detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .user.open .detail { display: block; }
    label.hint { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
    #brand { display: none; }
    #brand.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="brand">
      <h1>Veil Admin</h1>
      <p class="sub">Grant · ban · invalidate · revoke</p>
    </div>

    <div id="loginView" class="view show">
      <div class="card">
        <h2>Admin login</h2>
        <input type="password" id="adminPass" placeholder="Admin password" autocomplete="current-password" />
        <div class="row" style="margin-top:10px">
          <button class="primary" type="button" id="loginBtn">Enter</button>
        </div>
        <div class="msg" id="loginMsg"></div>
      </div>
    </div>

    <div id="appView" class="view">
      <div class="card">
        <h2>Users</h2>
        <div class="row">
          <input type="search" id="userSearch" placeholder="Search email…" />
          <button type="button" id="refreshUsers" style="flex:0 0 auto;width:auto;padding:0 16px">Refresh</button>
        </div>
        <div id="userList" style="margin-top:12px"></div>
        <div class="msg" id="userMsg"></div>
      </div>

      <div class="card">
        <h2>Global</h2>
        <button type="button" id="signoutAll">Kick everyone online</button>
        <div class="msg" id="globalMsg"></div>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
